[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."claude"]
  timeout = 26

[functions."check-results"]
  timeout = 26

# Long-running background workers (15-min budget). NOT scheduled directly —
# Netlify treats scheduled and background functions as mutually exclusive, so a
# schedule on a "-background" function does not fire reliably. They are triggered
# by the lightweight scheduled functions below (and by the frontend/admin).
[functions."check-results-background"]
  timeout = 900

[functions."generate-recap-background"]
  timeout = 900

# Scheduled triggers (short-lived). These fire on cron and immediately invoke the
# background workers above.
[functions."check-results-scheduled"]
  schedule = "0 */3 * * *"

[functions."generate-recap-scheduled"]
  schedule = "0 4 * * 3"

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200

[[redirects]]
  from = "/api/data"
  to = "/.netlify/functions/data"
  status = 200

[[redirects]]
  from = "/api/claude"
  to = "/.netlify/functions/claude"
  status = 200

[[redirects]]
  from = "/api/check-results"
  to = "/.netlify/functions/check-results"
  status = 200

[[redirects]]
  from = "/api/generate-recap"
  to = "/.netlify/functions/generate-recap-background"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
